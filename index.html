<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير متابعة أعمال الصيانة اليومي</title>
<style>
:root{--n:#1f3a5f;--g:#6b7280;--b:#d4d8de;--bg:#f4f5f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#1c1c1c;font-size:16px}
header{background:#fff;border-bottom:2px solid var(--n);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header img.a{height:34px}header img.b{height:46px}header h1{font-size:15px;margin:0;font-weight:normal;text-align:center;flex:1;color:var(--n)}
main{max-width:640px;margin:0 auto;padding:12px 12px 120px}
.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--n)}
label{display:block;font-size:13px;color:var(--g);margin:10px 0 4px}label:first-of-type{margin-top:0}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #b9bfc8;border-radius:8px;background:#fff}
textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}.seg label{flex:1;margin:0;text-align:center;padding:10px 4px;border:1px solid #b9bfc8;border-radius:8px;color:#1c1c1c;font-size:14px}
.seg input{display:none}.seg input:checked+span{font-weight:bold}.seg label:has(input:checked){background:var(--n);color:#fff;border-color:var(--n)}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.wh b{color:var(--n)}
.x{background:none;border:0;color:#b42318;font:inherit;font-size:13px;padding:4px}
.btn{font:inherit;border:1px solid var(--n);background:#fff;color:var(--n);border-radius:8px;padding:10px 14px}
.btn.p{background:var(--n);color:#fff}.full{width:100%}
.th{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.th div{position:relative}.th img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--b)}
.th button{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#b42318;color:#fff;font-size:12px;line-height:20px;padding:0}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);padding:10px 12px;display:flex;gap:8px;max-width:none;justify-content:center}
.bar .btn{flex:1;max-width:300px;padding:13px}
#sig{width:100%;height:110px;border:1px dashed #9aa3af;border-radius:8px;touch-action:none;background:#fff}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;max-width:90%;text-align:center;z-index:9}
.pg{width:794px;height:1123px;background:#fff;padding:34px 36px;overflow:hidden;font-family:Tahoma,Arial,sans-serif;color:#111;direction:rtl;position:relative}
.pg *{box-sizing:border-box}
.ph{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--n);padding-bottom:10px;margin-bottom:14px}
.ph img.a{height:50px}.ph img.b{height:70px}.ph h1{font-size:22px;margin:0;font-weight:normal;flex:1;text-align:center}
.mt{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:14px}.mt td{padding:6px 4px;border-bottom:1px solid #555}.mt td.k{color:#444;white-space:nowrap;width:1%;border:0;padding-left:8px}.mt td.k+td{width:32%}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{background:var(--n);color:#fff;font-weight:normal;padding:7px 4px;border:1px solid #777}
.tb td{border:1px solid #777;padding:6px;vertical-align:top;min-height:34px}.tb td.c{text-align:center}
.nb{border:1px solid #777;min-height:90px;padding:8px;font-size:13px;margin-top:6px}
.sg{display:flex;gap:30px;margin-top:26px;font-size:13px}.sg div{flex:1;text-align:center}.sg i{display:block;height:50px;border-bottom:1px solid #444;margin-bottom:5px}.sg img{height:50px;max-width:100%}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ph2 figure{margin:0;border:1px solid #bbb;padding:6px;height:310px;display:flex;flex-direction:column}.ph2 img{flex:1;min-height:0;object-fit:contain;width:100%}.ph2 figcaption{font-size:12px;padding-top:4px;text-align:center}
</style></head><body>

async function shrink(file){let src;try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){const d=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(file)});src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=d})}

 el.innerHTML=`<div class="wh"><b class="num"></b><button class="x">حذف</button></div>
 <div class="row2"><div><label>المكان</label><input type="text" data-k="place"></div><div><label>نوع العمل</label><select data-k="type">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div></div>
 <label>العمل الذي تم تنفيذه</label><textarea data-k="work"></textarea>
 <label>الحالة</label><div class="seg">${STAT.map(s=>`<label><input type="radio" name="${id}" value="${s}"><span>${s}</span></label>`).join("")}</div>
 <label>ملاحظات</label><input type="text" data-k="note">
 <div style="margin-top:10px"><button class="btn pb">📷 إضافة صور</button><input type="file" accept="image/*" multiple hidden></div><div class="th"></div>`;
 el.querySelectorAll("[data-k]").forEach(i=>{i.value=r[i.dataset.k];i.oninput=()=>{r[i.dataset.k]=i.value;save()}});
 el.querySelectorAll(`[name=${id}]`).forEach(i=>{i.checked=i.value===r.status;i.onchange=()=>{r.status=i.value;save()}});
 const th=el.querySelector(".th"),fi=el.querySelector("[type=file]");
 const draw=()=>{th.innerHTML="";r.photos.forEach((p,k)=>{const d=document.createElement("div");d.innerHTML=`<img src="${p}"><button>×</button>`;d.querySelector("button").onclick=()=>{r.photos.splice(k,1);draw()};th.appendChild(d)})};
 el.querySelector(".pb").onclick=()=>fi.click();
 fi.onchange=async()=>{for(const f of fi.files){try{r.photos.push(await shrink(f))}catch(e){toast("تعذّر قراءة إحدى الصور")}}fi.value="";draw()};
 el.querySelector(".x").onclick=()=>{if(confirm("حذف هذا العمل؟")){rows.splice(rows.indexOf(r),1);el.remove();num();save()}};
 $("rows").appendChild(el);num();return r}
function num(){document.querySelectorAll("#rows .num").forEach((b,i)=>b.textContent="عمل رقم "+(i+1))}
$("add").onclick=()=>addRow();
["hotel","date","sup","tech","spec"].forEach(k=>$(k).oninput=save);document.querySelectorAll("[name=sh]").forEach(i=>i.onchange=save);
// signature pad
const cv=$("sig"),cx=cv.getContext("2d");function fit(){const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;cx.scale(2,2);cx.lineWidth=2;cx.lineCap="round"}fit();
let dn=false;const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y)};
cv.onpointermove=e=>{if(!dn)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke();signed=true};
cv.onpointerup=()=>dn=false;$("sigc").onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);signed=false};
// restore draft
try{const d=JSON.parse(localStorage.getItem("mr_draft")||"null");if(d){$("hotel").value=d.h.hotel||"";$("date").value=d.h.date||today();$("sup").value=d.h.sup||"";$("tech").value=d.h.tech||"";$("spec").value=d.h.spec||TYPES[0];document.querySelectorAll("[name=sh]").forEach(i=>i.checked=i.value===d.h.sh);(d.rows||[]).forEach(addRow)}}catch(e){}
if(!rows.length)addRow();
$("reset").onclick=()=>{if(confirm("مسح كل بيانات التقرير الحالي؟")){try{localStorage.removeItem("mr_draft")}catch(e){}location.reload()}};
// PDF
const fmt=v=>{const[y,m,d]=v.split("-");return `${d}/${m}/${y}`};
function hdr(){return `<div class="ph"><img class="a" src="${L1}"><h1>تقرير متابعة أعمال الصيانة اليومي</h1><img class="b" src="${L2}"></div>`}
function meta(){const dt=$("date").value,day=new Date(dt+"T12:00").toLocaleDateString("ar",{weekday:"long"});const sh=document.querySelector("[name=sh]:checked").value;
 return `<table class="mt"><tr><td class="k">اسم الفندق</td><td>${esc($("hotel").value)}</td><td class="k">الوردية</td><td>${sh}</td></tr><tr><td class="k">المشرف</td><td>${esc($("sup").value)}</td><td class="k">التاريخ</td><td>${fmt(dt)} — ${day}</td></tr><tr><td class="k">موظف الصيانة</td><td>${esc($("tech").value)}</td><td class="k">التخصص</td><td>${$("spec").value}</td></tr></table>`}
function pageEl(chunk,first,last,start){const e=document.createElement("div");e.className="pg";
 let h=first?hdr()+meta():`<div style="font-size:13px;color:#444;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:10px">${esc($("hotel").value)} — ${fmt($("date").value)} (تابع)</div>`;
 if(chunk.length)h+=`<table class="tb"><tr><th style="width:5%">م</th><th style="width:15%">المكان</th><th style="width:10%">نوع العمل</th><th>العمل الذي تم تنفيذه</th><th style="width:9%">الحالة</th><th style="width:16%">ملاحظات</th></tr>${chunk.map(r=>`<tr><td class="c">${r.i}</td><td>${esc(r.place)}</td><td class="c">${r.type}</td><td>${esc(r.work)}</td><td class="c">${r.status}</td><td>${esc(r.note)}${r.photos.length?`<div style="color:#555;margin-top:3px">📷 ${r.photos.length} صورة</div>`:""}</td></tr>`).join("")}</table>`;
 if(last)h+=`<div style="margin-top:14px;font-size:13px">ملاحظات المشرف:</div><div class="nb"></div><div class="sg"><div>${signed?`<img src="${cv.toDataURL()}">`:"<i></i>"}توقيع الموظف</div><div><i></i>توقيع المشرف</div><div><i></i>توقيع مدير الصيانة</div></div>`;
 e.innerHTML=h;return e}
async function makePdf(){
 if(!$("hotel").value.trim()||!$("tech").value.trim()){toast("اكتب اسم الفندق واسم الموظف");return null}
 const used=rows.map((r,i)=>({...r,i:i+1})).filter(r=>r.work.trim()||r.place.trim());
 if(!used.length){toast("اكتب عملاً واحداً على الأقل");return null}
 if(!window.html2canvas||!window.jspdf){toast("تعذّر تحميل أدوات الـPDF، تأكد من الإنترنت");return null}
 toast("جاري تجهيز الـPDF...");const st=$("stage");st.innerHTML="";const pages=[];let rest=used.slice(),done=false;
 while(!done){let n=rest.length,el;for(;;){el=pageEl(rest.slice(0,n),!pages.length,n===rest.length);st.appendChild(el);if(el.scrollHeight<=1123||n===0)break;st.removeChild(el);n--}
  if(n===0&&rest.length){n=1;st.removeChild(el);el=pageEl(rest.slice(0,1),!pages.length,rest.length===1);st.appendChild(el)}
  done=n===rest.length;pages.push(el);rest=rest.slice(n)}
 const ph=used.flatMap(r=>r.photos.map(p=>({p,c:`عمل رقم ${r.i}${r.place?" — "+r.place:""}`})));
 for(let k=0;k<ph.length;k+=6){const e=document.createElement("div");e.className="pg";e.innerHTML=`<div style="font-size:15px;color:var(--n);border-bottom:2px solid var(--n);padding-bottom:6px;margin-bottom:12px">صور الأعمال — ${esc($("hotel").value)} — ${fmt($("date").value)}</div><div class="ph2">${ph.slice(k,k+6).map(x=>`<figure><img src="${x.p}"><figcaption>${esc(x.c)}</figcaption></figure>`).join("")}</div>`;st.appendChild(e);pages.push(e)}
 const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
 for(let i=0;i<pages.length;i++){const c=await html2canvas(pages[i],{scale:2,backgroundColor:"#fff",width:794,height:1123,windowWidth:794});if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.85),"JPEG",0,0,210,297)}
 st.innerHTML="";return pdf.output("blob")}
const fname=()=>`تقرير_صيانة_${$("hotel").value.trim().replace(/\s+/g,"_")}_${$("date").value}.pdf`;
async function saveBlob(b,n){try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:n,data:b});return}}}catch(e){if(e&&e.code==="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e4)}
$("save").onclick=async()=>{const b=await makePdf();if(b){await saveBlob(b,fname());toast("تم تجهيز الملف")}};
$("share").onclick=async()=>{const b=await makePdf();if(!b)return;const n=fname(),pf=new File([b],n,{type:"application/pdf"});
 const txt=`تقرير صيانة — ${$("hotel").value} — ${fmt($("date").value)}`;
 try{let files=[pf];
  if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:txt,text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
 await saveBlob(b,n);window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");toast("تم حفظ الملف، أرفقه في محادثة الواتساب")};
</script></body></html>
